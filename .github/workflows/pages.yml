# Publishes Frontiers and Foundations (built on Verdant Engine + Prism) to
# GitHub Pages using the official GitHub Actions Pages pipeline, following the
# same pinned two-job structure used by afflom/verdant-engine and Prism apps.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: verify and assemble the GitHub Pages bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Typecheck and run Verdant & gameplay verification tests
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm test

      - name: Build static GitHub Pages bundle
        shell: bash
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          VITE_STATIC_PAGES: 'true'
        run: |
          set -euo pipefail
          npm run build:pages

      - name: Stamp release provenance and verify Verdant Pages bundle
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin || '' }}
          PAGES_URL: ${{ steps.pages.outputs.base_url || '' }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const manifest = {
              app: "Frontiers and Foundations",
              engine: "verdant-engine",
              repository: process.env.GITHUB_REPOSITORY || "",
              commit: process.env.GITHUB_SHA || "",
              ref: process.env.GITHUB_REF || "",
              basePath: process.env.PAGES_BASE_PATH || "/",
              pagesUrl: process.env.PAGES_URL || "",
              builtAt: new Date().toISOString(),
            };
            fs.writeFileSync("dist/verdant/pages-release.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          node scripts/verify-pages-bundle.mjs --dir dist --base "${PAGES_BASE_PATH}"

      - name: Upload the page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    name: publish the page
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
